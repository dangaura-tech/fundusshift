  access: grand-challenge (registration) / Kaggle mirror andrewmvd/ocular-disease-recognition-odir5k
  license: research only
  url: https://odir2019.grand-challenge.org/
  role: dev
  adapter:
    type: odir
    file: ODIR-5K/data.xlsx
    image_dir: ODIR-5K/Training Images
  label_map: {"normal fundus": N, "lens dust": IGNORE, "image offset": IGNORE, "low image quality": EXCLUDE,
              "optic disk photographically invisible": EXCLUDE, "no fundus image": EXCLUDE,
              "glaucoma": G, "suspected glaucoma": EXCLUDE,
              "dry age-related macular degeneration": A, "wet age-related macular degeneration": A,
              "age-related macular degeneration": A}
  label_map_regex:
    - ["(non)?proliferative retinopathy|diabetic retinopathy", D]

- id: rfmid
  name: RFMiD 1.0 (Retinal Fundus Multi-disease Image Dataset)
  family: RFMID_NANDED
  country: India
  device: Kowa VX-10 alpha, TOPCON 3D OCT-2000, Kowa VX-10
  n_approx: 3200
  access: IEEE DataPort open access
  license: CC BY 4.0
  url: https://ieee-dataport.org/open-access/retinal-fundus-multi-disease-image-dataset-rfmid
