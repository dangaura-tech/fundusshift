- {id: retinal_lesions, name: Retinal-Lesions (Wei et al. 2021), family: EYEPACS, role: exclude,
   exclude_reason: "1,593 images re-annotated from Kaggle EyePACS.", url: "https://github.com/WeiQijie/retinal-lesions"}
- {id: smdg19, name: SMDG-19 (Standardized Multi-channel Dataset for Glaucoma), family: AGGREGATOR, role: exclude,
   exclude_reason: "Aggregates ORIGA, REFUGE, RIM-ONE, ACRIMA, G1020, Drishti, PAPILA, HRF, ... -> cross-source duplicates.",
   url: "https://www.kaggle.com/datasets/deathtrooper/multichannel-glaucoma-benchmark-dataset"}
- {id: kaggle_eye_diseases_classification, name: "Kaggle 'Eye diseases classification' (4 classes)", family: AGGREGATOR, role: exclude,
   exclude_reason: "Re-packages IDRiD, ODIR, HRF and others.", url: "https://www.kaggle.com/datasets/gunavenkatdoddi/eye-diseases-classification"}
- {id: kaggle_cataract, name: Kaggle cataract dataset, family: AGGREGATOR, role: exclude,
   exclude_reason: "Re-packages HRF/ODIR/etc.; cataract is out of the core label space.", url: "https://www.kaggle.com/datasets/jr2ngb/cataractdataset"}
- {id: aptos_gaussian, name: "APTOS derivative (224x224 Gaussian filtered)", family: APTOS_ARAVIND, role: exclude,
   exclude_reason: "Pre-processed copy of APTOS 2019.", url: "https://www.kaggle.com/datasets/sovitrath/diabetic-retinopathy-224x224-gaussian-filtered"}
- {id: rfmid2, name: RFMiD 2.0, family: RFMID_NANDED, role: exclude,
   exclude_reason: "Optional; same centre as RFMiD 1.0. Add as dev after pHash check if more data is needed.", url: "https://doi.org/10.3390/data8020029"}
- {id: palm, name: PALM (pathologic myopia), family: ICHALLENGE_ZOC, role: exclude,
   exclude_reason: "Myopia is outside the core label space; overlapping normals with ADAM/REFUGE possible.", url: "https://palm.grand-challenge.org/"}
- {id: sjchoi86_hrf, name: "Kaggle 'sjchoi86' fundus (normal/glaucoma/cataract/retina disease)", family: UNKNOWN, role: exclude,
   exclude_reason: "Undocumented origin.", url: "https://github.com/cvblab/retina_dataset"}
- {id: e_ophtha, name: e-ophtha (MA/EX), family: OPHDIAT_FRANCE, role: exclude,
   exclude_reason: "Lesion segmentation; optional extra D source.", url: "https://www.adcis.net/en/third-party/e-ophtha/"}
- {id: diaretdb1, name: DIARETDB0/1, family: DIARETDB_FINLAND, role: exclude,
   exclude_reason: "Tiny lesion sets; optional.", url: "https://www.it.lut.fi/project/imageret/"}
- {id: areds, name: AREDS (dbGaP), family: AREDS, role: restricted, exclude_reason: "Controlled access (dbGaP).", url: "https://www.ncbi.nlm.nih.gov/projects/gap/cgi-bin/study.cgi?study_id=phs000001"}
- {id: ukbb, name: UK Biobank retinal photos, family: UKBB, role: restricted, exclude_reason: "Application + fee.", url: "https://www.ukbiobank.ac.uk/"}
