# FundusShift — source registry (full inventory incl. non-redistributable sources)
#
# Harmonized core task (one label per colour fundus photograph):
#   N = apparently normal fundus (source explicitly says normal/healthy, or DR grade 0 in a DR-graded set)
#   D = diabetic-retinopathy-like findings
#   G = glaucomatous optic neuropathy / glaucoma (incl. "possible glaucoma" only where noted)
#   A = age-related macular degeneration-like findings
# Map value meanings: N/D/G/A = harmonized class, IGNORE = token does not affect the label,
#   EXCLUDE = image leaves the core task. Tokens absent from the map count as OTHER -> excluded.
#
# role:   dev        -> train / val / calibration pool
#         test       -> held-out source (whole source goes to test)
#         ood_test   -> held-out and reported separately (strong acquisition shift)
#         exclude    -> listed for completeness, not used (reason given)
#         restricted -> not publicly downloadable
# family: acquisition origin. Sources sharing a family must share a side (dev vs test). The audit enforces this.
#
# Counts (n_approx) and file layouts are from the dataset papers / release pages and MUST be confirmed
# after download: build_manifest.py prints the real counts and fails loudly on missing columns.

sources:

# ----------------------------------------------------------------------------------------------- DR (dev)
- id: eyepacs_kaggle
  name: EyePACS / Kaggle Diabetic Retinopathy Detection (2015)
  family: EYEPACS
  country: USA
  device: multiple (EyePACS screening network)
  n_approx: 88702
  access: Kaggle competition (login + accept rules); labels for test in retinopathy_solution.csv
  license: Kaggle competition rules (non-commercial research)
  url: https://www.kaggle.com/c/diabetic-retinopathy-detection
  role: dev
  normal_scope: dr_only
  adapter:
    type: csv
    tables:
      - {file: trainLabels.csv, image_dir: train}
      - {file: retinopathy_solution.csv, image_dir: test}
    image_col: image
    path_template: "{image}.jpeg"
    label_col: level
    grade_col: level
    patient_regex: "^(\\d+)_"
    eye_regex: "_(left|right)$"
  label_map: {"0": N, "1": D, "2": D, "3": D, "4": D}

