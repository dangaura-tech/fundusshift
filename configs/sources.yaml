# ------------------------------------------------------------------------------------ held-out TEST sources
- id: brset
  name: BRSET — Brazilian Multilabel Ophthalmological Dataset
  family: BRSET_SAOPAULO
  country: Brazil (São Paulo)
  device: Nikon NF5050, Canon CR-2
  n_approx: 16266
  access: PhysioNet credentialed (CITI training + DUA) — you must request it yourself
  license: PhysioNet Credentialed Health Data License 1.5.0
  url: https://physionet.org/content/brset/
  role: test
  normal_scope: full
  adapter:
    type: csv
    tables: [{file: labels.csv, image_dir: fundus_photos}]
    image_col: image_id
    path_template: "{image}.jpg"
    patient_col: patient_id
    grade_col: DR_ICDR
    keep_if: {quality: Adequate}
    multihot_cols: [diabetic_retinopathy, macular_edema, scar, nevus, amd, vascular_occlusion,
                    hypertensive_retinopathy, drusens, hemorrhage, retinal_detachment, myopic_fundus,
                    increased_cup_disc, other]
    normal_if_all_zero: true
  label_map: {NORMAL: N, diabetic_retinopathy: D, hemorrhage: IGNORE, macular_edema: IGNORE,
              amd: A, drusens: IGNORE, increased_cup_disc: G}
  notes: hemorrhage/macular_edema/drusens are IGNORE so they co-occur with D or A; alone they give no label.

